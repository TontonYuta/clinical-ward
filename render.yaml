services:
  - type: web
    name: clinical-ward-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # The image needs both backend runtime files and the repository's public
    # medical PDFs. Keep the repository root as context so the Dockerfile can
    # copy both sets without relying on files outside the build context.
    dockerContext: .
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: CORS_ORIGINS
        value: https://clinical-ward.vercel.app,http://localhost:3000,http://localhost:3001,https://clinical-ai-monitor.vercel.app
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/clinical_hospital.db
      - key: RENDER_DEPLOY_TRIGGER
        value: "20261110-monograph-schema-patch-v6"
